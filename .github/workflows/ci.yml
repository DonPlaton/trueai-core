name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # A fuzzer that only runs on pull requests explores a few thousand cases and
    # stops. The nightly run is where the long campaigns happen.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  # Detector execution and report ordering must not depend on hash randomization.
  PYTHONHASHSEED: "0"

jobs:
  static-analysis:
    name: Lint, format, and strict types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with development tooling
        run: python -m pip install --editable ".[dev,pdf]"
      - name: Ruff lint
        run: python -m ruff check --output-format=github .
      - name: Ruff format check
        run: python -m ruff format --check .
      # Both platforms, because the project has code for both. One run answers
      # for the operating system it runs on and is blind to the other's branch --
      # which is how the Windows restricted-token path went unchecked on Linux
      # until the day a hosted runner tried.
      - name: Strict mypy as Windows
        run: python -m mypy --platform win32
      - name: Strict mypy as Linux
        run: python -m mypy --platform linux

  test:
    name: Tests ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # POSIX agents can create symlinks and drop permissions, so the security
      # cases must execute there instead of silently skipping. See
      # tests/support.py for the enforcement helper.
      TRUEAI_REQUIRE_PRIVILEGED_TESTS: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with development tooling
        run: python -m pip install --editable ".[dev,pdf]"
      - name: Report optional dependency availability
        run: python -m trueai doctor
      - name: Run the test suite
        run: python -m pytest --cov=trueai --cov-report=term-missing --cov-report=xml -rs
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  adversarial:
    name: Hostile-input fixtures on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      TRUEAI_REQUIRE_PRIVILEGED_TESTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --editable ".[dev,pdf]"
      - name: Run security-boundary and hostile-input suites
        run: >-
          python -m pytest -rs
          tests/integration/test_discovery_security.py
          tests/unit/test_svg_detector.py
          tests/unit/test_docx_detector.py
          tests/unit/test_office_detectors.py
          tests/unit/test_pdf_detector.py
          tests/unit/test_media_detector.py
          tests/unit/test_provenance.py
          tests/unit/test_plugin_host.py
          tests/unit/test_repository_scale.py

  plugin-boundary:
    name: Plugin trust boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --editable ".[dev]"
      - name: Fuzz the protocol, manifests, findings, and limits
        # A short campaign on every push, so a regression at the boundary shows up
        # in the pull request that caused it. The nightly run below goes deeper.
        run: python scripts/fuzz_plugins.py --iterations 20000
      - name: Confinement against a real kernel
        # Runs unsandboxed because the confinement being tested is the one that
        # protects a developer's machine, and GitHub's runner filter blocks the
        # unshare it depends on.
        run: |
          python scripts/verify_linux_confinement.py
          python scripts/verify_native_plugins.py

  nightly-fuzz:
    name: Continuous fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [protocol, manifest, distribution, findings, limits, broker]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --editable ".[dev]"
      - name: Fuzz ${{ matrix.target }} for ten minutes
        # The seed is printed by the harness, so a failure here replays locally
        # with: python scripts/fuzz_plugins.py --seed <printed> --iterations 200000
        run: >-
          python scripts/fuzz_plugins.py
          --target ${{ matrix.target }} --iterations 0 --seconds 600

  provenance:
    name: Authenticated C2PA verification
    runs-on: ubuntu-latest
    env:
      # The verification suite is this project's only coverage of authenticated
      # provenance. Skipping it because an optional dependency is missing would
      # report green while proving nothing, so here the skip becomes a failure.
      TRUEAI_REQUIRE_OPTIONAL_DEPENDENCIES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install with the optional verifier
        run: python -m pip install --editable ".[dev,c2pa]"
      - name: Confirm the verifier is reported as available
        run: python -m trueai doctor
      - name: Run the provenance verification suite
        run: python -m pytest tests/unit/test_provenance_verification.py -rs

  schema-compatibility:
    name: Public schema 0.1 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --editable ".[dev]"
      - name: Enforce the frozen report schema contract
        run: python -m pytest tests/unit/test_schema_compatibility.py -q
      - name: Confirm the committed snapshot matches the emitted schema
        run: python scripts/check_schema_snapshot.py
      - name: Confirm the certificate schema snapshot matches
        run: |
          python -m trueai certificates schema > /tmp/trueai-certificate-schema.json
          diff -u schema/trueai-certificate-0.1.schema.json /tmp/trueai-certificate-schema.json
      - name: Confirm the revocation-list schema snapshot matches
        run: |
          python -m trueai certificates revocation-schema > /tmp/trueai-revocation-schema.json
          diff -u schema/trueai-revocation-list-0.1.schema.json /tmp/trueai-revocation-schema.json
      - name: Confirm the enterprise policy-bundle schema snapshot matches
        run: |
          python -m trueai policies bundle-schema > /tmp/trueai-policy-bundle-schema.json
          diff -u schema/trueai-policy-bundle-0.1.schema.json /tmp/trueai-policy-bundle-schema.json
      - name: Verify signed policy bundle semantics
        run: python -m pytest tests/unit/test_policy_bundles.py -q
      - name: Confirm the process-attestation schema snapshot matches
        run: |
          python -c "from trueai.core.attestation import attestation_schema_json;             import sys; sys.stdout.write(attestation_schema_json())"             > /tmp/trueai-process-attestation-schema.json
          diff -u schema/trueai-process-attestation-0.1.schema.json             /tmp/trueai-process-attestation-schema.json
      - name: Verify process-attestation semantics
        run: python -m pytest tests/unit/test_attestation.py -q
      - name: Enforce the frozen Python API contract
        run: python -m pytest tests/unit/test_api_compatibility.py -q
      - name: Confirm the committed snapshot matches the emitted API surface
        run: python scripts/check_api_snapshot.py

  package:
    name: Build, verify, and install distributions
    runs-on: ubuntu-latest
    needs: [static-analysis]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # A reproducible SOURCE_DATE_EPOCH is derived from the commit date.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install the locked build environment
        run: |
          python -m pip install "uv==0.12.5"
          python -m uv sync --frozen --all-extras --group release
      - name: Confirm the dependency lock matches pyproject.toml
        run: python -m uv lock --check
      - name: Build wheel and sdist
        run: >-
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          python -m uv run python -m build --no-isolation --outdir dist
      - name: Validate distribution metadata
        run: python -m uv run twine check --strict dist/*
      - name: Rebuild and compare for reproducibility
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            python -m uv run python -m build --no-isolation --outdir dist-rebuild
          python -m uv run python scripts/compare_builds.py dist dist-rebuild
      - name: Verify the packaged source manifest
        run: python -m uv run python scripts/check_manifest.py
      # The manifest gate reads the archives, so it can only run once they exist.
      # It skips everywhere else, and this variable turns that skip into a
      # failure here, where `dist/` has just been filled.
      - name: Run the supply-chain suite against the built distributions
        env:
          TRUEAI_REQUIRE_BUILT_DISTRIBUTIONS: "1"
          TRUEAI_REQUIRE_OPTIONAL_DEPENDENCIES: "1"
        run: python -m uv run python -m pytest tests/unit/test_supply_chain.py -rs
      - name: Record the build inputs an auditor needs
        run: |
          python -m uv run python scripts/record_build_inputs.py \
            --dist dist --source-date-epoch "$(git log -1 --pretty=%ct)"
          cat dist/build-inputs.json
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean-env
          /tmp/clean-env/bin/python -m pip install "$(ls dist/*.whl)[pdf,c2pa,attestation]"
          /tmp/clean-env/bin/python -m pip check
      - name: Smoke-test the installed console script
        run: |
          export PATH="/tmp/clean-env/bin:$PATH"
          bash scripts/smoke_test.sh /tmp/clean-env/bin/trueai
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  reproducible-build:
    name: Container build is byte-for-byte reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The build clock is the commit date, which needs history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build the pinned auditor image twice and compare
        run: python scripts/verify_reproducible_build.py
      - name: Confirm the image runs with no network
        run: |
          EPOCH="$(git log -1 --pretty=%ct)"
          docker build --build-arg SOURCE_DATE_EPOCH="$EPOCH" -t trueai-core:audit .
          docker run --rm --network none trueai-core:audit --version
          docker run --rm --network none trueai-core:audit doctor

  supply-chain:
    name: Dependency, license, and SBOM review
    runs-on: ubuntu-latest
    env:
      # The test matrix installs `.[dev,pdf]` so that graceful degradation is
      # covered, which means the tests that walk the *whole* runtime closure skip
      # there. This is the job that installs all of it, so here the skip is a
      # failure -- otherwise those gates are never actually run anywhere.
      TRUEAI_REQUIRE_OPTIONAL_DEPENDENCIES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install the locked audit environment
        run: |
          python -m pip install "uv==0.12.5"
          python -m uv sync --frozen --all-extras --group release
      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m uv export --frozen --no-emit-project --no-editable --all-extras \
            --no-extra dev --no-dev --no-group release --output-file audit-requirements.txt
          python -m uv run python -m pip_audit --strict --require-hashes \
            --requirement audit-requirements.txt --progress-spinner off
      - name: Enforce the dependency license allowlist
        run: python -m uv run python scripts/check_licenses.py
      # Prose has no compiler. This checks that the nouns exist: commands,
      # options, links, and the files a completed backlog item cites.
      - name: Check the documentation names things that exist
        run: python -m uv run python scripts/check_docs.py
      # pip-audit above answers "is there a known CVE right now". This answers
      # "has anybody looked, and does the ledger still describe this build" —
      # including the standard-library parsers no dependency audit mentions.
      - name: Check the advisory ledger is current and complete
        run: python -m uv run python scripts/check_advisories.py
      - name: Generate a CycloneDX SBOM
        run: >-
          python -m uv run python scripts/generate_sbom.py
          --timestamp "$(git log -1 --pretty=%ct)" --output sbom.cdx.json
      # A document that exists and has blanks in it passes a consumer's "do you
      # have an SBOM" check while answering none of their questions.
      - name: Check every component carries a version, a license, and a purl
        run: python -m uv run python scripts/generate_sbom.py --check
      # The gates above run as scripts. This runs the tests *about* the gates,
      # in the one environment where their prerequisite exists.
      - name: Run the supply-chain suite against the complete closure
        run: python -m uv run python -m pytest tests/unit/test_supply_chain.py -rs
      - name: Upload the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
