name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after all gates pass"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build signed, attested distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and audit tooling
        run: python -m pip install build twine cyclonedx-bom pip-audit

      - name: Confirm the tag matches the package version
        id: version
        run: python scripts/check_release_tag.py

      - name: Build reproducible distributions
        run: SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" python -m build --outdir dist

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify the packaged source manifest
        run: python scripts/check_manifest.py

      - name: Audit dependencies before publishing
        run: |
          python -m pip install ".[pdf]"
          python -m pip_audit --strict --progress-spinner off

      - name: Enforce the dependency license allowlist
        run: |
          python -m pip install pip-licenses
          python scripts/check_licenses.py

      - name: Generate the release SBOM
        run: cyclonedx-py environment --output-format JSON --outfile dist/sbom.cdx.json

      - name: Record SHA-256 digests
        run: |
          cd dist
          sha256sum ./*.whl ./*.tar.gz ./sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      # Build provenance ties each artifact to this workflow, commit, and runner.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

      # Keyless Sigstore signatures let consumers verify without a long-lived key.
      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz
          upload-signing-artifacts: true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trueai-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Remove non-distribution artifacts before upload
        run: rm -f dist/SHA256SUMS dist/sbom.cdx.json dist/*.sigstore dist/*.sigstore.json
      # Trusted publishing; no API token is stored in the repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
